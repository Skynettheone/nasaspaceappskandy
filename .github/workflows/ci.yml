name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: Check exported routes
        run: |
          for route in about events challenges ambassadors join sponsors news register contact privacy; do
            test -f "out/$route/index.html"
          done
          test -f out/index.html
